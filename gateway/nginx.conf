##############################################################################
# TenantWarden — Nginx Gateway
##############################################################################

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    ##########################################################################
    # Logging
    ##########################################################################
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time';

    access_log /var/log/nginx/access.log main;

    ##########################################################################
    # Performance
    ##########################################################################
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    ##########################################################################
    # Security headers
    ##########################################################################
    server_tokens off;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    ##########################################################################
    # Rate limiting zones
    ##########################################################################
    limit_req_zone $binary_remote_addr zone=api_limit:10m        rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m       rate=10r/m;
    limit_req_zone $binary_remote_addr zone=agent_limit:10m      rate=300r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m    rate=100r/m;

    ##########################################################################
    # Upstream definitions
    ##########################################################################
    # Docker's DNS: "resolve" re-reads a service's address when its container is recreated,
    # so rebuilding one service doesn't leave the gateway answering 502 until it restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream frontend_upstream {
        zone frontend_upstream 64k;
        server frontend:3000 resolve;
        keepalive 32;
    }

    upstream api_upstream {
        zone api_upstream 64k;
        server api:8080 resolve;
        keepalive 32;
    }

    upstream auth_upstream {
        zone auth_upstream 64k;
        server auth-service:8081 resolve;
        keepalive 16;
    }

    upstream agent_gw_upstream {
        zone agent_gw_upstream 64k;
        server agent-gateway:8082 resolve;
        keepalive 64;
    }

    ##########################################################################
    # HTTP → HTTPS redirect
    ##########################################################################
    server {
        listen 80;
        server_name _;
        client_max_body_size 50m;

        location /auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass         http://auth_upstream/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass         http://api_upstream/api/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /ws/ {
            proxy_pass         http://api_upstream/ws/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Only the agent WebSocket is public; /command and /agents are internal-only
        location = /agent/ws {
            limit_req zone=agent_limit burst=100 nodelay;
            proxy_pass         http://agent_gw_upstream/ws;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_read_timeout 300s;
        }

        location /agent/ {
            return 404;
        }

        location /downloads/ {
            alias /usr/share/nginx/agent-dist/;
            autoindex on;
            add_header Content-Disposition 'attachment';
        }

        location / {
            limit_req zone=general_limit burst=50 nodelay;
            proxy_pass         http://frontend_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_intercept_errors on;
            error_page 404 = @spa_fallback;
        }

        location @spa_fallback {
            proxy_pass http://frontend_upstream;
        }
    }

    ##########################################################################
    # Main HTTPS server
    ##########################################################################
    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 50m;

        # ── Auth service ───────────────────────────────────────────────────
        location /auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass         http://auth_upstream/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Core API ───────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass         http://api_upstream/api/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ── WebSocket (SignalR / live updates) ─────────────────────────────
        location /ws/ {
            proxy_pass         http://api_upstream/ws/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Agent Gateway (HTTP upgrade to WebSocket) ──────────────────────
        # Only the agent WebSocket is public; /command and /agents are internal-only
        location = /agent/ws {
            limit_req zone=agent_limit burst=100 nodelay;
            proxy_pass         http://agent_gw_upstream/ws;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_read_timeout 300s;
        }

        location /agent/ {
            return 404;
        }

        # ── Frontend (SPA — all other routes) ─────────────────────────────
        location /downloads/ {
            alias /usr/share/nginx/agent-dist/;
            autoindex on;
            add_header Content-Disposition 'attachment';
        }

        location / {
            limit_req zone=general_limit burst=50 nodelay;
            proxy_pass         http://frontend_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # SPA fallback — return index.html for all 404s from frontend
            proxy_intercept_errors on;
            error_page 404 = @spa_fallback;
        }

        location @spa_fallback {
            proxy_pass http://frontend_upstream;
        }
    }
}
