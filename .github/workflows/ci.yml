name: TenantWarden CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/tenantwarden

jobs:

  # ── Lint + Test ──────────────────────────────────────────────────────────────
  test-node:
    name: Test Node services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [collector-service, alert-engine, analytics-engine, notification-service, scheduler, plugin-engine]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: '${{ matrix.service }}/package-lock.json' }
      - run: npm ci
        working-directory: ${{ matrix.service }}
      - run: npm run build
        working-directory: ${{ matrix.service }}
      - run: npm test -- --run
        working-directory: ${{ matrix.service }}
        continue-on-error: true

  test-dotnet:
    name: Test .NET services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '9.0.x' }
      - run: dotnet restore api/TenantWarden.Api.csproj
      - run: dotnet build api/TenantWarden.Api.csproj -c Release --no-restore
      - run: dotnet restore auth-service/TenantWarden.Auth.csproj
      - run: dotnet build auth-service/TenantWarden.Auth.csproj -c Release --no-restore
      - run: dotnet restore agent-gateway/TenantWarden.AgentGateway.csproj
      - run: dotnet build agent-gateway/TenantWarden.AgentGateway.csproj -c Release --no-restore

  test-go:
    name: Test Go agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - run: go vet ./...
        working-directory: agent
      - run: go test ./... -v -race
        working-directory: agent

  test-frontend:
    name: Test frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: 'frontend/package-lock.json' }
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  # ── Build agent binaries ─────────────────────────────────────────────────────
  build-agent:
    name: Build agent binaries
    runs-on: ubuntu-latest
    needs: [test-go]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - run: make all
        working-directory: agent
        env:
          VERSION: ${{ github.ref_name }}-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: agent-binaries
          path: agent/dist/

  # ── Build + push Docker images ───────────────────────────────────────────────
  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [test-node, test-dotnet, test-frontend]
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - { name: api,                  path: api,                  dockerfile: api/Dockerfile }
          - { name: auth-service,         path: auth-service,         dockerfile: auth-service/Dockerfile }
          - { name: frontend,             path: frontend,             dockerfile: frontend/Dockerfile }
          - { name: collector-service,    path: collector-service,    dockerfile: collector-service/Dockerfile }
          - { name: alert-engine,         path: alert-engine,         dockerfile: alert-engine/Dockerfile }
          - { name: analytics-engine,     path: analytics-engine,     dockerfile: analytics-engine/Dockerfile }
          - { name: notification-service, path: notification-service, dockerfile: notification-service/Dockerfile }
          - { name: agent-gateway,        path: agent-gateway,        dockerfile: agent-gateway/Dockerfile }
          - { name: scheduler,            path: scheduler,            dockerfile: scheduler/Dockerfile }
          - { name: plugin-engine,        path: plugin-engine,        dockerfile: plugin-engine/Dockerfile }
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.path }}
          file:    ${{ matrix.service.dockerfile }}
          push:    true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Security scan ────────────────────────────────────────────────────────────
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type:    fs
          scan-ref:     .
          format:       sarif
          output:       trivy-results.sarif
          severity:     CRITICAL,HIGH
      - uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: trivy-results.sarif }
        continue-on-error: true
