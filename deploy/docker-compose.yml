# TenantWarden from pre-built images on Docker Hub: no clone and no build needed.
#
#   1. Put this file and .env.example (renamed to .env) in an empty folder.
#   2. Fill in the five secrets in .env, e.g. with `openssl rand -hex 32`.
#   3. docker compose up -d
#
# Portal: http://localhost:8090 (https on 8443 with a self-signed certificate until you mount
# your own). Sign in as admin@tenantwarden.local / TenantWarden! and choose a new password.
# After pulling a newer version: docker compose exec postgres tenantwarden-migrate
#                             docker compose exec clickhouse tenantwarden-migrate
#
# Building from source instead? Use the docker-compose.yml in the repository root.

name: tenantwarden

x-service: &service
  restart: unless-stopped
  networks: [internal]

networks:
  internal:

volumes:
  postgres-data:
  clickhouse-data:
  redis-data:
  gateway-certs:

services:

  # Reverse proxy and the only published ports. With no certificate in gateway-certs it
  # creates a self-signed one for TW_HOSTNAME on first start.
  gateway:
    <<: *service
    image: ${TW_IMAGE_PREFIX:-docker.io/jahmed22/tenantwarden}-gateway:${TW_VERSION:-1.0.0}
    ports:
      - "${GATEWAY_HTTP_PORT:-8090}:80"
      - "${GATEWAY_HTTPS_PORT:-8443}:443"
    environment:
      - TW_HOSTNAME=${TW_HOSTNAME:-localhost}
    volumes:
      # Your own certificate: replace this line with a folder holding server.crt and server.key,
      # e.g. ./certs:/etc/nginx/certs:ro
      - gateway-certs:/etc/nginx/certs
      # Agent binaries served at /downloads/ (build them with `make build-agent` in the repository)
      # - ./agent-dist:/usr/share/nginx/agent-dist:ro
    depends_on: [frontend, api, auth-service, agent-gateway]

  frontend:
    <<: *service
    image: ${TW_IMAGE_PREFIX:-docker.io/jahmed22/tenantwarden}-frontend:${TW_VERSION:-1.0.0}

  api:
    <<: *service
    image: ${TW_IMAGE_PREFIX:-docker.io/jahmed22/tenantwarden}-api:${TW_VERSION:-1.0.0}
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Postgres=Host=postgres;Database=tenantwarden;Username=tenantwarden;Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__ClickHouse=http://tenantwarden:${CLICKHOUSE_PASSWORD}@clickhouse:8123/tenantwarden_analytics
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD},abortConnect=false
      - Auth__Jwt__SigningKey=${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
      - Auth__Jwt__Issuer=tenantwarden
      - Auth__Jwt__Audience=tenantwarden-api
      - Encryption__TenantSecretKey=${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      - App__Version=${TW_VERSION:-1.0.0}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clickhouse: { condition: service_healthy }

  auth-service:
    <<: *service
    image: ${TW_IMAGE_PREFIX:-docker.io/jahmed22/tenantwarden}-auth-service:${TW_VERSION:-1.0.0}
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8081
      - ConnectionStrings__Postgres=Host=postgres;Database=tenantwarden;Username=tenantwarden;Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD},abortConnect=false
      - Auth__Jwt__SigningKey=${JWT_SIGNING_KEY}
      - Auth__Jwt__Issuer=tenantwarden
      - Auth__Jwt__Audience=tenantwarden-api
      - Auth__Totp__Issuer=TenantWarden
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Agents connect through the gateway (/agent/ws). Port 4433 is only needed for direct TLS
  # connections: mount server.crt/server.key/ca.crt at /certs and publish "4433:4433".
  agent-gateway:
    <<: *service
    image: ${TW_IMAGE_PREFIX:-docker.io/jahmed22/tenantwarden}-agent-gateway:${TW_VERSION:-1.0.0}
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Postgres=Host=postgres;Database=tenantwarden;Username=tenantwarden;Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD},abortConnect=false
      - Auth__Jwt__SigningKey=${JWT_SIGNING_KEY}
      - Auth__Jwt__Issuer=tenantwarden
      - Tls__CertPath=/certs/server.crt
      - Tls__KeyPath=/certs/server.key
      - Tls__CaPath=/certs/ca.crt
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  collector-service:
    <<: *service
    image: ${TW_IMAGE_PREFIX:-docker.io/jahmed22/tenantwarden}-collector-service:${TW_VERSION:-1.0.0}
    environment:
      - NODE_ENV=production
      - POSTGRES_URL=postgresql://tenantwarden:${POSTGRES_PASSWORD}@postgres:5432/tenantwarden
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - COLLECTOR_INTERVAL_SECONDS=${COLLECTOR_INTERVAL:-900}
      - GRAPH_API_BATCH_SIZE=20
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  alert-engine:
    <<: *service
    image: ${TW_IMAGE_PREFIX:-docker.io/jahmed22/tenantwarden}-alert-engine:${TW_VERSION:-1.0.0}
    environment:
      - NODE_ENV=production
      - EVAL_INTERVAL_SECONDS=60
      - POSTGRES_URL=postgresql://tenantwarden:${POSTGRES_PASSWORD}@postgres:5432/tenantwarden
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  notification-service:
    <<: *service
    image: ${TW_IMAGE_PREFIX:-docker.io/jahmed22/tenantwarden}-notification-service:${TW_VERSION:-1.0.0}
    environment:
      - NODE_ENV=production
      - POSTGRES_URL=postgresql://tenantwarden:${POSTGRES_PASSWORD}@postgres:5432/tenantwarden
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - APP_URL=${APP_URL:-http://localhost:8090}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-alerts@tenantwarden.local}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  analytics-engine:
    <<: *service
    image: ${TW_IMAGE_PREFIX:-docker.io/jahmed22/tenantwarden}-analytics-engine:${TW_VERSION:-1.0.0}
    environment:
      - NODE_ENV=production
      - ANALYTICS_INTERVAL_SECONDS=14400
      - POSTGRES_URL=postgresql://tenantwarden:${POSTGRES_PASSWORD}@postgres:5432/tenantwarden
      - CLICKHOUSE_URL=http://clickhouse:8123
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }

  scheduler:
    <<: *service
    image: ${TW_IMAGE_PREFIX:-docker.io/jahmed22/tenantwarden}-scheduler:${TW_VERSION:-1.0.0}
    environment:
      - NODE_ENV=production
      - POSTGRES_URL=postgresql://tenantwarden:${POSTGRES_PASSWORD}@postgres:5432/tenantwarden
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - API_URL=http://api:8080
      - COLLECTOR_URL=http://collector-service:3001
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # ── Data: not published on the host ─────────────────────────────────────────

  # Schema included; it is created on the first start of an empty volume
  postgres:
    <<: *service
    image: ${TW_IMAGE_PREFIX:-docker.io/jahmed22/tenantwarden}-postgres:${TW_VERSION:-1.0.0}
    environment:
      - POSTGRES_DB=tenantwarden
      - POSTGRES_USER=tenantwarden
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantwarden -d tenantwarden"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    <<: *service
    image: ${TW_IMAGE_PREFIX:-docker.io/jahmed22/tenantwarden}-clickhouse:${TW_VERSION:-1.0.0}
    environment:
      - CLICKHOUSE_DB=tenantwarden_analytics
      - CLICKHOUSE_USER=tenantwarden
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  redis:
    <<: *service
    image: redis:7.2-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
