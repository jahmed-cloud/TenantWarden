global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster: tenantwarden
    environment: production

# ─── Alerting rules ───────────────────────────────────────────────────────────
rule_files:
  - /etc/prometheus/rules/*.yml

# ─── Scrape configs ───────────────────────────────────────────────────────────
scrape_configs:

  - job_name: tenantwarden-api
    static_configs:
      - targets: ['api:8080']
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: tenantwarden-auth
    static_configs:
      - targets: ['auth-service:8081']
    metrics_path: /metrics

  - job_name: tenantwarden-collector
    static_configs:
      - targets: ['collector-service:3001']
    metrics_path: /metrics

  - job_name: tenantwarden-alert-engine
    static_configs:
      - targets: ['alert-engine:3002']
    metrics_path: /metrics

  - job_name: tenantwarden-agent-gateway
    static_configs:
      - targets: ['agent-gateway:8082']
    metrics_path: /metrics

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: nginx
    static_configs:
      - targets: ['gateway:9113']
