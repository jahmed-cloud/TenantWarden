openapi: "3.1.0"
info:
  title: TenantWarden API
  version: "1.0.0"
  description: >
    TenantWarden — self-hosted security monitoring for Microsoft 365.
    All endpoints require Bearer JWT authentication except /auth/*.

servers:
  - url: https://your-domain.com/api/v1
    description: Production
  - url: http://localhost:8080/api/v1
    description: Development

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    Alert:
      type: object
      properties:
        id:          { type: string, format: uuid }
        tenantId:    { type: string, format: uuid }
        title:       { type: string }
        description: { type: string }
        severity:    { type: string, enum: [critical, high, medium, low, info] }
        status:      { type: string, enum: [active, acknowledged, investigating, resolved, suppressed] }
        source:      { type: string }
        category:    { type: string }
        createdAt:   { type: string, format: date-time }
        updatedAt:   { type: string, format: date-time }

    PagedResult:
      type: object
      properties:
        items:      { type: array, items: {} }
        total:      { type: integer }
        page:       { type: integer }
        pageSize:   { type: integer }
        totalPages: { type: integer }

    CustomEvent:
      type: object
      required: [source, eventType, message]
      properties:
        source:     { type: string, example: "my-siem" }
        eventType:  { type: string, example: "suspicious_login" }
        message:    { type: string }
        severity:   { type: string, enum: [critical, high, medium, low, info], default: info }
        occurredAt: { type: string, format: date-time }
        data:       { type: object, additionalProperties: true }

security:
  - BearerAuth: []

paths:
  /alerts:
    get:
      summary: List alerts
      parameters:
        - { name: tenantId,  in: query, required: true,  schema: { type: string } }
        - { name: severity,  in: query, required: false, schema: { type: string } }
        - { name: status,    in: query, required: false, schema: { type: string } }
        - { name: search,    in: query, required: false, schema: { type: string } }
        - { name: page,      in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: pageSize,  in: query, required: false, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200": { description: Paged list of alerts, content: { application/json: { schema: { $ref: "#/components/schemas/PagedResult" } } } }

  /alerts/{id}/acknowledge:
    post:
      summary: Acknowledge an alert
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string }
      responses:
        "204": { description: Alert acknowledged }
        "404": { description: Alert not found }

  /alerts/{id}/resolve:
    post:
      summary: Resolve an alert
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution]
              properties:
                resolution: { type: string }
      responses:
        "204": { description: Alert resolved }

  /events:
    post:
      summary: Ingest custom events
      description: >
        Send up to 1000 custom events per request from any external source
        (SIEM, Splunk, Azure Monitor, Syslog, etc.)
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/CustomEvent" }
              maxItems: 1000
      responses:
        "202":
          description: Events accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ingested: { type: integer }

  /identity/risky-users:
    get:
      summary: List risky users
      parameters:
        - { name: tenantId,   in: query, required: true,  schema: { type: string } }
        - { name: riskLevel,  in: query, required: false, schema: { type: string, enum: [high, medium, low, none] } }
        - { name: page,       in: query, required: false, schema: { type: integer } }
        - { name: pageSize,   in: query, required: false, schema: { type: integer } }
      responses:
        "200": { description: Paged list of risky users }

  /identity/risky-users/{userId}/reset-password:
    post:
      summary: Reset a risky user's password
      parameters:
        - { name: userId,   in: path,  required: true,  schema: { type: string } }
        - { name: tenantId, in: query, required: true,  schema: { type: string } }
      responses:
        "200": { description: Password reset initiated }

  /agents:
    get:
      summary: List agents for a tenant
      parameters:
        - { name: tenantId, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: List of agents }

  /agents/register:
    post:
      summary: Register a new agent
      responses:
        "201": { description: Agent registered }

  /overview/summary:
    get:
      summary: Dashboard overview summary
      parameters:
        - { name: tenantId, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Overview stats including alerts, agents, identity, devices }
