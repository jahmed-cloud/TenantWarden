apiVersion: v2
name:        tenantwarden
description: TenantWarden — self-hosted security monitoring for Microsoft 365
type:        application
version:     1.0.0
appVersion:  "1.0.0"

dependencies:
  - name:       postgresql
    version:    "15.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition:  postgresql.enabled

  - name:       redis
    version:    "19.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition:  redis.enabled
