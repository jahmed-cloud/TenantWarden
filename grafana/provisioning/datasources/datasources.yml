apiVersion: 1

datasources:
  - name:      Prometheus
    type:      prometheus
    access:    proxy
    url:       http://prometheus:9090
    isDefault: true
    editable:  true

  - name:    Loki
    type:    loki
    access:  proxy
    url:     http://loki:3100
    editable: true

  - name:    PostgreSQL
    type:    postgres
    access:  proxy
    url:     postgres:5432
    database: tenantwarden
    user:    tenantwarden
    editable: true
    jsonData:
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
